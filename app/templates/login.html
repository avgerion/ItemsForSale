<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>Sign in · Items for Sale</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20252d; background: #f5f6f8; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 20px; }
    main { width: min(100%, 390px); padding: 32px; border: 1px solid #e7e9ed; border-radius: 14px; background: white; box-shadow: 0 16px 44px rgb(30 38 32 / 7%); }
    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 30px; font-weight: 720; letter-spacing: -.03em; }
    .mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; color: white; background: #41644a; }
    .brand small { display: block; margin-top: 2px; color: #737b87; font-size: 10px; font-weight: 550; letter-spacing: .06em; }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.04em; }
    p { color: #737b87; font-size: 13px; line-height: 1.55; }
    label { display: block; margin: 16px 0 6px; color: #59626d; font-size: 11px; font-weight: 650; }
    input { width: 100%; min-height: 42px; padding: 0 11px; border: 1px solid #dfe3e7; border-radius: 7px; font: inherit; }
    input:focus { outline: 3px solid rgb(65 100 74 / 12%); border-color: #91ad97; }
    button { width: 100%; min-height: 43px; margin-top: 22px; border: 0; border-radius: 8px; color: white; background: #41644a; font: inherit; font-size: 13px; font-weight: 680; cursor: pointer; }
    button:hover { background: #31543a; }
    .error { padding: 10px 12px; border: 1px solid #f0d2ce; border-radius: 7px; color: #963d36; background: #fff0ee; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">S</span><span>Stockroom<small>ITEMS FOR SALE</small></span></div>
    <h1>Welcome back</h1>
    <p>Sign in to manage your inventory and sale events.</p>
    __ERROR__
    <form action="/login" method="post">
      <input type="hidden" name="csrf_token" value="__CSRF_TOKEN__">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <p><a href="/" style="color:#41644a">Return to public catalog</a></p>
  </main>
</body>
</html>
